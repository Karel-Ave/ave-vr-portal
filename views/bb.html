'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pageState={view:new URLSearchParams(location.search).get('view')==='schedule'?'schedule':'requests',result:null,data:null,editing:false,dirty:false,loading:false,saving:false,epoch:0};
let followCurrentRequests=pageState.view==='requests';
const names=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
$('month').innerHTML=names.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');const initialPeriod=BbCalendar.defaultPeriod(pageState.view);$('month').value=initialPeriod.month;$('year').value=initialPeriod.year;
function msg(text,error=false){$('status').hidden=!text;$('status').textContent=text;$('status').classList.toggle('error',error);}
async function api(url,body){const r=await fetch(url,{credentials:'include',cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok||!j.ok)throw Object.assign(new Error(j.msg||'Operace selhala.'),{duplicates:j.duplicates});return j;}
function period(){return {month:Number($('month').value),year:Number($('year').value)};}
function fullEditor(){const p=pageState.result?.permissions||{};return pageState.view==='requests'?p.requests_edit_all:p.schedule_edit;}
function ownRow(uid){const p=pageState.result.permissions;return pageState.view==='requests'&&p.requests_edit_own&&pageState.result.status==='open'&&Number(uid)===Number(pageState.result.userId);}
function duplicates(){const map=new Map();for(const [key,value]of Object.entries(pageState.data?.cells||{})){if(value!=='W')continue;const [uid,day]=key.split('-').map(Number);if(!map.has(day))map.set(day,[]);map.get(day).push(uid);}return map;}
function duplicateTitle(day){return (duplicates().get(day)||[]).map(id=>{const peer=pageState.result.staff.find(s=>s.userId===id);const meta=pageState.data.meta?.[id+'-'+day];return {name:peer?.name||id,...meta};}).sort((a,b)=>(Number(a.order)&&Number(b.order)?Number(a.order)-Number(b.order):String(a.at||'').localeCompare(String(b.at||'')))).map((x,i)=>`${i+1}. ${x.name}${x.author?' (zapsal '+x.author+')':''}${x.at?' — '+new Date(x.at).toLocaleString('cs-CZ'):''}`).join('\n');}
function refreshCoverageHeaders(coverage=duplicates()){
 document.querySelectorAll('th[data-bb-day]').forEach(th=>{const missing=!(coverage.get(Number(th.dataset.bbDay))?.length);th.classList.toggle('unassigned',missing);th.setAttribute('aria-label',th.dataset.date+(missing?' — Neobsazená směna BB':''));});
}
function refreshEditedCells(){
 const dupes=duplicates();refreshCoverageHeaders(dupes);
 document.querySelectorAll('td[data-cell-key]').forEach(td=>{const key=td.dataset.cellKey,day=Number(key.split('-')[1]),value=pageState.data.cells[key]||'',unavailable=td.classList.contains('unavailable'),collision=value==='W'&&(dupes.get(day)?.length||0)>1;td.classList.toggle('duplicate',collision);td.classList.toggle('working',unavailable&&value==='W');td.title=[unavailable?'Pravidelné volno BB — tento den nemůže pracovat.':'',collision?'Duplicitní směna\n'+duplicateTitle(day):''].filter(Boolean).join('\n');});
 document.querySelectorAll('tr[data-user-id]').forEach(row=>{const count=BbCalendar.countShifts(pageState.data.cells,row.dataset.userId,Number($('year').value),Number($('month').value));const correction=pageState.view==='schedule'?BbAdjustments.total(pageState.data.adjustments?.[row.dataset.userId]):0;row.querySelector('.shifts-total').textContent=count;row.querySelector('.hours-total').textContent=BbAdjustments.format(count*12+correction);});
}
function render(){const r=pageState.result;if(!r)return;const p=r.permissions,hasRequests=!!r.requirements&&!r.requestsPublished;
$('print').hidden=pageState.view!=='schedule'||!pageState.data||!p.schedule_view;$('print').disabled=pageState.editing;$('print').title=pageState.editing?'Nejdříve uložte nebo zrušte editaci':'Vytisknout Rozpis BB';$('print-title').textContent='Rozpis BB – '+names[r.month-1]+' '+r.year;
$('funds-edit').hidden=pageState.view!=='requests'||!pageState.data||!fullEditor();
$('funds-info').hidden=!pageState.data;$('funds-info').innerHTML=[['hpp','HPP'],['zpp','ZPP'],['dpc','DPČ']].map(([key,label])=>'Fond '+label+': <strong>'+esc(BbCalendar.formatFund(pageState.data?.funds?.[key]))+'</strong>').join('<br>');
$('create').hidden=!p.create||!!r.requirements||pageState.view!=='requests';$('toggle').hidden=!p.requests_open||!hasRequests||pageState.view!=='requests';$('toggle').textContent=r.status==='open'?'Ukončit editaci':'Povolit editaci';$('publish').hidden=!p.publish||!hasRequests||pageState.view!=='requests';$('publish').disabled=pageState.editing||r.status==='open';$('edit').hidden=!pageState.data||!(fullEditor()||(pageState.view==='requests'&&p.requests_edit_own&&r.status==='open'&&pageState.data.staffIds.includes(Number(r.userId))));$('edit').disabled=pageState.editing;$('save-row').hidden=!pageState.editing;$('add-wrap').hidden=!(pageState.editing&&fullEditor()&&p.add_staff);
$('add-person').innerHTML=(r.available||[]).filter(s=>!(pageState.data?.staffIds||[]).includes(s.userId)).map(s=>`<option value="${s.userId}">${esc(s.name)} (${esc(s.login)})</option>`).join('');
if(!pageState.data){$('table').innerHTML='';msg(pageState.view==='requests'?'Žádné aktuální požadavky.':'Rozpis BB pro tento měsíc ještě není publikovaný.');return;}
const {month,year}=period(),cols=BbCalendar.columns(year,month),dupes=duplicates(),extraHolidays=pageState.data.extraHolidays||[],scheduleView=pageState.view==='schedule';
let html='<table style="--bb-scroll-width:'+(170+cols.length*36+(scheduleView?122:88))+'px"><colgroup><col class="name-col">'+cols.map(()=>'<col class="day-col">').join('')+'<col class="total-col">'+(scheduleView?'<col class="total-col adjustment-col">':'')+'<col class="total-col"></colgroup><thead><tr><th class="name">Bagážista/Barman</th>';for(const col of cols){const dt=new Date(col.date+'T00:00:00Z');html+=`<th data-bb-day="${col.index}" data-date="${col.date}" class="${[0,6].includes(dt.getUTCDay())?'weekend ':''}${col.spill?'spill ':''}${BbAvailability.isHoliday(col.month,col.day,col.spill?[]:extraHolidays)?'is-holiday':''}" title="${col.date}">${col.spill?'1.1.':col.day}<br>${['ne','po','út','st','čt','pá','so'][dt.getUTCDay()]}</th>`;}html+='<th>Směny</th>'+(scheduleView?'<th>+/−</th>':'')+'<th>Hodiny</th></tr></thead><tbody>';
const normalizeRole=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const isPorter=person=>normalizeRole(person.role)==='bagazista'||normalizeRole(person.type)==='bagazista';
const isSelf=({uid,person})=>Number(uid)===Number(r.userId)&&isPorter(person);
// Sort only the displayed rows; keep saved staff IDs, cells and notes intact.
const rows=(pageState.data.staffIds||[]).map(uid=>({uid,person:r.staff.find(s=>s.userId===Number(uid))||r.available?.find(s=>s.userId===Number(uid))})).filter(({uid,person})=>person&&(isPorter(person)||pageState.editing||cols.some(col=>pageState.data.cells[uid+'-'+col.index]==='W'))).sort((a,b)=>Number(isSelf(b))-Number(isSelf(a))||Number(!isPorter(a.person))-Number(!isPorter(b.person))||a.person.name.localeCompare(b.person.name,'cs',{sensitivity:'base',numeric:true})||Number(a.uid)-Number(b.uid));
for(const {uid,person} of rows){const editable=pageState.editing&&(fullEditor()||ownRow(uid));let shifts=0;const note=pageState.data.notes?.[uid]||'';const noteButton=(pageState.view==='requests'||r.canViewPublishedNotes)?'<button type="button" class="req-note-btn'+(note?' pending':'')+'" data-note-button="'+uid+'" '+(pageState.view==='requests'&&editable?'':'disabled')+' aria-label="PR '+esc(person.name)+'" title="'+esc(note||'Poznámku lze upravit v režimu editace')+'">PR</button>':'';html+=`<tr data-user-id="${uid}" class="${isPorter(person)?'bb-staff-row':'bb-receptionist-row'}"><td class="name${isSelf({uid,person})?' own-name':''}" title="${esc(person.name)}"><span class="bb-name-wrap"><span class="bb-name-text">${esc(person.name)}</span>${noteButton}</span></td>`;
for(const col of cols){const d=col.index,key=uid+'-'+d,value=pageState.data.cells[key]||'';if(value==='W'&&!col.spill)shifts++;const unavailable=BbAvailability.isUnavailable(person.availability,col.year,col.month,col.day,col.spill?[]:extraHolidays);const cellEditable=editable&&(value!=='z'||r.canManageAbsence);const collision=value==='W'&&(dupes.get(d)?.length||0)>1;const info=duplicateTitle(d);html+=`<td data-cell-key="${key}" class="${[0,6].includes(new Date(col.date+'T00:00:00Z').getUTCDay())?'weekend ':''}${col.spill?'spill ':''}${unavailable?'unavailable ':''}${unavailable&&value==='W'?'working ':''}${collision?'duplicate':''}" title="${esc([unavailable?'Pravidelné volno BB — tento den nemůže pracovat.':'',collision?'Duplicitní směna\n'+info:''].filter(Boolean).join('\n'))}">${cellEditable?`<input data-cell="${key}" value="${esc(value)}" maxlength="1" aria-label="${esc(person.name)}, ${col.day}.${col.month}.${col.year}" autocomplete="off">`:esc(value)}</td>`;}
const corrections=scheduleView?(pageState.data.adjustments?.[uid]||[]):[],correction=BbAdjustments.total(corrections),canEditHours=scheduleView&&pageState.editing&&r.canManageHours;html+=`<td class="total shifts-total">${shifts}</td>`;if(scheduleView)html+=`<td class="total hours-adjustment${canEditHours?' adjustable':''}" data-hours-user="${uid}" ${canEditHours?'role="button" tabindex="0"':''} title="${esc(BbAdjustments.title(corrections)||(canEditHours?'Přidat korekci hodin':''))}">${correction?BbAdjustments.format(correction):''}</td>`;html+=`<td class="total hours-total">${BbAdjustments.format(shifts*12+correction)}</td>`;html+='</tr>';}
$('table').innerHTML=html+'</tbody></table>';refreshCoverageHeaders(dupes);msg(pageState.view==='requests'&&!pageState.editing?(r.status==='open'?'Požadavky jsou otevřené pro zápis.':'Editace požadavků je ukončená.'):'');
}
async function load(){let selected=period();const epoch=++pageState.epoch;pageState.loading=true;$('table').hidden=true;$('funds-info').hidden=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('table').setAttribute('aria-busy','true');try{if(pageState.view==='requests'&&followCurrentRequests){const current=await api('/api/bb/current');if(epoch!==pageState.epoch)return;selected=current.period||BbCalendar.defaultPeriod('requests');$('month').value=selected.month;$('year').value=selected.year;}const r=await api('/api/bb/month?'+new URLSearchParams(selected));if(epoch!==pageState.epoch)return;pageState.result=r;if(!r.permissions[pageState.view+'_view'])pageState.view=r.permissions.requests_view?'requests':'schedule';pageState.editing=false;pageState.dirty=false;const source=pageState.view==='requests'?(r.requestsPublished?null:r.requirements):r.published;pageState.data=source?structuredClone(source):null;
if(pageState.view==='schedule'&&pageState.data){pageState.data.cells=pageState.data.cells||{};pageState.data.staffIds=pageState.data.staffIds||[];for(const key of Object.keys(pageState.data.cells))if(pageState.data.cells[key]==='W')delete pageState.data.cells[key];for(const s of r.shifts||[]){if(!pageState.data.staffIds.includes(s.userId))pageState.data.staffIds.push(s.userId);pageState.data.cells[s.userId+'-'+BbCalendar.dayIndex(r.year,r.month,s.date)]='W';}}
render();}catch(e){if(epoch===pageState.epoch){pageState.result=null;$('table').innerHTML='';msg(e.message,true);}}finally{if(epoch===pageState.epoch){pageState.loading=false;$('table').hidden=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(pageState.result)render();$('table').removeAttribute('aria-busy');}}}
function leaving(){return !pageState.dirty||confirm('Máte neuložené změny BB. Zahodit je?');}
$('table').addEventListener('input',e=>{const key=e.target.dataset.cell;if(key){const raw=e.target.value.trim();const value=raw.toLowerCase()==='w'?'W':raw.toLowerCase();if(value&&!['W','x',...(pageState.result.canManageAbsence?['z']:[])].includes(value)){e.target.value=pageState.data.cells[key]||'';return;}if(value)pageState.data.cells[key]=value;else delete pageState.data.cells[key];e.target.value=value;pageState.dirty=true;refreshEditedCells();}});
let hoursUid=null,hoursEditIndex=null;
function renderHoursList(){const list=pageState.data.adjustments?.[hoursUid]||[];$('hours-list').innerHTML=list.map((entry,index)=>'<div><span>'+esc(BbAdjustments.title([entry]))+'</span><button type="button" data-hours-edit="'+index+'" title="Upravit">✏</button><button type="button" data-hours-delete="'+index+'" title="Smazat">×</button></div>').join('');}
function saveHoursList(list){pageState.data.adjustments=pageState.data.adjustments||{};if(list.length)pageState.data.adjustments[hoursUid]=list;else delete pageState.data.adjustments[hoursUid];pageState.dirty=true;render();}
$('table').addEventListener('click',event=>{const cell=event.target.closest('[data-hours-user]');if(!cell||!pageState.editing||pageState.view!=='schedule'||!pageState.result.canManageHours)return;hoursUid=Number(cell.dataset.hoursUser);hoursEditIndex=null;const person=pageState.result.staff.find(p=>p.userId===hoursUid);$('hours-title').textContent='± Hodiny — '+(person?.name||'');$('hours-value').value='';$('hours-note').value='';$('hours-date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('hours-apply').textContent='Přidat';$('hours-error').textContent='';renderHoursList();$('hours-dialog').showModal();$('hours-value').focus();});
$('table').addEventListener('keydown',event=>{if(event.target.matches('[data-hours-user][role="button"]')&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.click();}});
$('hours-list').onclick=event=>{if(!pageState.editing||!pageState.result.canManageHours)return;const edit=event.target.dataset.hoursEdit,remove=event.target.dataset.hoursDelete,list=structuredClone(pageState.data.adjustments?.[hoursUid]||[]);if(edit!==undefined){hoursEditIndex=Number(edit);const entry=list[hoursEditIndex];$('hours-value').value=BbAdjustments.format(entry.val);$('hours-note').value=entry.note;$('hours-date').value=entry.date;$('hours-apply').textContent='Uložit';}if(remove!==undefined){list.splice(Number(remove),1);hoursEditIndex=null;saveHoursList(list);renderHoursList();$('hours-value').value='';$('hours-note').value='';$('hours-apply').textContent='Přidat';}};
$('hours-close').onclick=()=>$('hours-dialog').close();
$('hours-form').onsubmit=event=>{event.preventDefault();if(!pageState.editing||pageState.view!=='schedule'||!pageState.result.canManageHours||hoursUid===null)return;try{const entry=BbAdjustments.entry({val:$('hours-value').value,note:$('hours-note').value,date:$('hours-date').value}),list=structuredClone(pageState.data.adjustments?.[hoursUid]||[]);if(hoursEditIndex===null)list.push(entry);else list[hoursEditIndex]=entry;saveHoursList(list);$('hours-dialog').close();}catch(error){$('hours-error').textContent=error.message;}};
let noteUid=null;
$('table').addEventListener('click',e=>{const button=e.target.closest('[data-note-button]');if(!button||button.disabled||!pageState.editing||pageState.view!=='requests')return;noteUid=Number(button.dataset.noteButton);const person=pageState.result.staff.find(p=>p.userId===noteUid);$('note-person').textContent=person?.name||'';$('note-text').value=pageState.data.notes?.[noteUid]||'';$('note-dialog').showModal();$('note-text').focus();});
$('note-cancel').onclick=()=>$('note-dialog').close();
$('note-form').onsubmit=e=>{e.preventDefault();if(!pageState.editing||pageState.view!=='requests'||noteUid===null||!(fullEditor()||ownRow(noteUid)))return;pageState.data.notes=pageState.data.notes||{};const note=$('note-text').value.trim();if(note)pageState.data.notes[noteUid]=note;else delete pageState.data.notes[noteUid];pageState.dirty=true;$('note-dialog').close();noteUid=null;render();};
$('table').addEventListener('change',e=>{if(e.target.dataset.cell)refreshEditedCells();});
$('print').onclick=()=>{if(pageState.view==='schedule'&&pageState.data&&!pageState.editing&&!pageState.loading&&!pageState.saving)window.print();};
$('edit').onclick=()=>{pageState.editing=true;render();};$('cancel').onclick=()=>{if(leaving())load();};
for(const id of ['month','year'])$(id).onchange=()=>{const selected=period();if(!pageState.loading&&selected.month===pageState.result?.month&&selected.year===pageState.result?.year)return;if(leaving()){followCurrentRequests=false;load();}else{$('month').value=pageState.result.month;$('year').value=pageState.result.year;}};
$('add').onclick=()=>{const uid=Number($('add-person').value);if(uid&&!pageState.data.staffIds.includes(uid)){pageState.data.staffIds.push(uid);const person=pageState.result.available.find(s=>s.userId===uid);if(person&&!pageState.result.staff.some(s=>s.userId===uid))pageState.result.staff.push(person);pageState.dirty=true;render();}};
async function perform(url,body){
 if(pageState.loading||pageState.saving)return;
 const selected=pageState.result?{month:pageState.result.month,year:pageState.result.year}:period();pageState.saving=true;
 document.querySelectorAll('button').forEach(b=>b.disabled=true);$('month').disabled=true;$('year').disabled=true;
 let error=null;
 try{for(;;){try{await api(url,{...selected,...body});break;}catch(e){if(e.duplicates?.length&&!body.confirmDuplicates&&confirm(e.message)){body={...body,confirmDuplicates:true};continue;}throw e;}}
   try{parent.postMessage({type:'bb-changed'},location.origin);}catch{}if(url==='/api/bb/create'||url==='/api/bb/publish')followCurrentRequests=true;await load();
 }catch(e){error=e;}finally{pageState.saving=false;$('month').disabled=false;$('year').disabled=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);render();if(error)msg(error.message,true);}
}
let fundsMode='create';
function openFunds(mode){fundsMode=mode;$('funds-title').textContent=(mode==='create'?'Vytvořit požadavky BB':'Fondy a svátky BB')+' · '+names[Number($('month').value)-1]+' '+$('year').value;$('funds-confirm').textContent=mode==='create'?'Vytvořit':'OK';for(const key of ['hpp','zpp','dpc'])$('fund-'+key).value=mode==='create'?'':String(pageState.data?.funds?.[key]??'').replace('.',',');$('extra-holidays').value=mode==='create'?'':(pageState.data?.extraHolidays||[]).join(', ');$('funds-error').textContent='';$('funds-dialog').showModal();}
$('funds-cancel').onclick=()=>$('funds-dialog').close();
$('funds-form').onsubmit=async e=>{e.preventDefault();try{const funds=BbCalendar.normalizeFunds(Object.fromEntries(['hpp','zpp','dpc'].map(key=>[key,$('fund-'+key).value])));const extraHolidays=BbCalendar.normalizeExtraHolidays($('extra-holidays').value,Number($('year').value),Number($('month').value));$('funds-dialog').close();if(fundsMode==='create')await perform('/api/bb/create',{funds,extraHolidays});else{pageState.data.funds=funds;pageState.data.extraHolidays=extraHolidays;pageState.editing=true;pageState.dirty=true;render();}}catch(error){$('funds-error').textContent=error.message;}};
$('funds-edit').onclick=()=>openFunds('edit');$('create').onclick=()=>openFunds('create');$('toggle').onclick=()=>{if(leaving())perform('/api/bb/status',{status:pageState.result.status==='open'?'closed':'open'});};
$('save').onclick=()=>{const r=pageState.result;perform(pageState.view==='requests'?'/api/bb/requests':'/api/bb/schedule',{data:pageState.data,assignmentVersion:r.assignmentVersion,revision:pageState.view==='requests'?r.revision:r.publishedRevision,rowVersion:r.requirements?.rowVersions?.[r.userId]||0});};
$('publish').onclick=()=>{if(confirm('Publikovat požadavky jako Rozpis BB?'))perform('/api/bb/publish',{revision:pageState.result.revision,publishedRevision:pageState.result.publishedRevision});};
window.addEventListener('beforeunload',e=>{if(pageState.dirty){e.preventDefault();e.returnValue='';}});window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='bb-visible'&&!pageState.editing)load();});setInterval(()=>{if(!document.hidden&&!pageState.editing)load();},30000);load();
</script></body></html>
