<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bagážisté – AVE</title><script src="/static/theme.js"></script><script src="/static/bb-availability.js"></script><link rel="stylesheet" href="/static/theme.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}main{padding:16px 14px calc(32px + env(safe-area-inset-bottom));max-width:1500px;margin:auto}header,.tools,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{border-bottom:1px solid var(--border);padding-bottom:12px}h1{font-size:22px;margin:0 auto 0 0}h2{font-size:17px}button,input,select,textarea{font:inherit;border:1px solid var(--btn-top-border);border-radius:6px;background:var(--surface);color:var(--text);padding:8px;min-height:42px}button{cursor:pointer;font-weight:600}button.on,.primary{background:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:default}.tools{margin:16px 0}.notice{padding:12px;background:var(--surface);border-left:3px solid var(--accent);line-height:1.5;margin:12px 0}.error{border-color:#bd3434}.table-wrap{overflow:auto;max-height:calc(100dvh - 160px);border:1px solid var(--border);background:var(--surface);-webkit-overflow-scrolling:touch}table{border-collapse:separate;border-spacing:0;min-width:100%}th,td{text-align:center;padding:0;min-width:36px;height:38px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}th{background:var(--bg-topbar);position:sticky;top:0;z-index:2;font-size:12px}th.name,td.name{text-align:left;min-width:180px;position:sticky;left:0;background:var(--surface);padding:8px;z-index:3;white-space:nowrap}th.name{z-index:4;background:var(--bg-topbar)}td.weekend,th.weekend{background:var(--surface-alt)}td.unavailable{background:#f5d7e3}html[data-theme="dark"] td.unavailable{background:#583440}td.unavailable.working{box-shadow:inset 0 0 0 2px #bf537a}td.duplicate{background:#ffe0e5!important;outline:2px solid #be3d56;outline-offset:-2px}[data-theme="dark"] td.duplicate{background:#622b36!important}td input{width:36px;min-width:36px;height:38px;padding:0;border:0;border-radius:0;background:transparent;text-align:center;font-weight:600}td input:focus{outline:2px solid var(--accent);outline-offset:-2px}.pr{width:170px;min-width:170px;resize:vertical;min-height:38px;font-weight:400;padding:7px}.muted{color:var(--text-muted);font-size:12px}.save{position:sticky;bottom:0;padding:12px 0;background:var(--bg);display:flex;gap:8px;justify-content:flex-end}.badge{font-size:12px;color:var(--text-muted)}[hidden]{display:none!important}.total{min-width:60px;padding:6px;font-weight:700}.name small{display:block;font-size:11px;color:var(--text-muted)}@media(max-width:600px){main{padding:12px 8px 28px}h1{font-size:19px}.tools{gap:6px}.table-wrap{max-height:calc(100dvh - 210px)}th.name,td.name{min-width:135px;font-size:12px}.pr{width:140px;min-width:140px}}</style></head><body><main>
<div class="tools"><label>Měsíc <select id="month"></select></label><label>Rok <input id="year" type="number" min="2020" max="2100" style="width:90px"></label><button id="create">Vytvořit požadavky</button><button id="toggle">Povolit editaci</button><button id="edit">Editovat</button><button id="publish" class="primary">Publikovat</button></div>
<div id="status" class="notice" role="status" hidden></div><div class="tools" id="add-wrap" hidden><select id="add-person" aria-label="Pracovník"></select><button id="add">Přidat pracovníka</button></div>
<div id="table" class="table-wrap"></div><div class="save" id="save-row" hidden><button id="cancel">Zrušit</button><button id="save" class="primary">Uložit</button></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pageState={view:new URLSearchParams(location.search).get('view')==='schedule'?'schedule':'requests',result:null,data:null,editing:false,dirty:false,loading:false,saving:false,epoch:0};
const names=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
$('month').innerHTML=names.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');const now=new Date();$('month').value=now.getMonth()+1;$('year').value=now.getFullYear();
function msg(text,error=false){$('status').hidden=!text;$('status').textContent=text;$('status').classList.toggle('error',error);}
async function api(url,body){const r=await fetch(url,{credentials:'include',cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok||!j.ok)throw Object.assign(new Error(j.msg||'Operace selhala.'),{duplicates:j.duplicates});return j;}
function period(){return {month:Number($('month').value),year:Number($('year').value)};}
function fullEditor(){const p=pageState.result?.permissions||{};return pageState.view==='requests'?p.requests_edit_all:p.schedule_edit;}
function ownRow(uid){const p=pageState.result.permissions;return pageState.view==='requests'&&p.requests_edit_own&&pageState.result.status==='open'&&Number(uid)===Number(pageState.result.userId);}
function duplicates(){const map=new Map();for(const [key,value]of Object.entries(pageState.data?.cells||{})){if(value!=='W')continue;const [uid,day]=key.split('-').map(Number);if(!map.has(day))map.set(day,[]);map.get(day).push(uid);}return map;}
function duplicateTitle(day){return (duplicates().get(day)||[]).map(id=>{const peer=pageState.result.staff.find(s=>s.userId===id);const meta=pageState.data.meta?.[id+'-'+day];return {name:peer?.name||id,...meta};}).sort((a,b)=>(Number(a.order)&&Number(b.order)?Number(a.order)-Number(b.order):String(a.at||'').localeCompare(String(b.at||'')))).map((x,i)=>`${i+1}. ${x.name}${x.author?' (zapsal '+x.author+')':''}${x.at?' — '+new Date(x.at).toLocaleString('cs-CZ'):''}`).join('\n');}
function refreshEditedCells(){
 const dupes=duplicates();
 document.querySelectorAll('td[data-cell-key]').forEach(td=>{const key=td.dataset.cellKey,day=Number(key.split('-')[1]),value=pageState.data.cells[key]||'',unavailable=td.classList.contains('unavailable'),collision=value==='W'&&(dupes.get(day)?.length||0)>1;td.classList.toggle('duplicate',collision);td.classList.toggle('working',unavailable&&value==='W');td.title=[unavailable?'Pravidelné volno BB — tento den nemůže pracovat.':'',collision?'Duplicitní směna\n'+duplicateTitle(day):''].filter(Boolean).join('\n');});
 document.querySelectorAll('tr[data-user-id]').forEach(row=>{const count=Object.entries(pageState.data.cells).filter(([key,value])=>key.startsWith(row.dataset.userId+'-')&&value==='W').length;const totals=row.querySelectorAll('.total');if(totals[0])totals[0].textContent=count;if(totals[1])totals[1].textContent=count*12;});
}
function render(){const r=pageState.result;if(!r)return;const p=r.permissions;
$('create').hidden=!p.create||!!r.requirements||pageState.view!=='requests';$('toggle').hidden=!p.requests_open||!r.requirements||pageState.view!=='requests';$('toggle').textContent=r.status==='open'?'Ukončit editaci':'Povolit editaci';$('publish').hidden=!p.publish||!r.requirements||pageState.view!=='requests';$('publish').disabled=pageState.editing||r.status==='open';$('edit').hidden=!pageState.data||!(fullEditor()||(pageState.view==='requests'&&p.requests_edit_own&&r.status==='open'&&pageState.data.staffIds.includes(Number(r.userId))));$('edit').disabled=pageState.editing;$('save-row').hidden=!pageState.editing;$('add-wrap').hidden=!(pageState.editing&&fullEditor()&&p.add_staff);
$('add-person').innerHTML=(r.available||[]).filter(s=>!(pageState.data?.staffIds||[]).includes(s.userId)).map(s=>`<option value="${s.userId}">${esc(s.name)} (${esc(s.login)})</option>`).join('');
if(!pageState.data){$('table').innerHTML='';msg(pageState.view==='requests'?'Požadavky pro tento měsíc nejsou vytvořené.':'Rozpis BB pro tento měsíc ještě není publikovaný.');return;}
const {month,year}=period(),days=new Date(year,month,0).getDate(),dupes=duplicates();
let html='<table><thead><tr><th class="name">Pracovník</th>';for(let d=1;d<=days;d++){const dt=new Date(year,month-1,d);html+=`<th class="${[0,6].includes(dt.getDay())?'weekend':''}">${d}<br>${['ne','po','út','st','čt','pá','so'][dt.getDay()]}</th>`;}html+='<th>Směny</th><th>Hodiny</th>'+(pageState.view==='requests'?'<th>PR</th>':'')+'</tr></thead><tbody>';
for(const uid of pageState.data.staffIds||[]){const person=r.staff.find(s=>s.userId===Number(uid))||r.available?.find(s=>s.userId===Number(uid));if(!person)continue;const editable=pageState.editing&&(fullEditor()||ownRow(uid));let shifts=0;html+=`<tr data-user-id="${uid}"><td class="name">${esc(person.name)}</td>`;
for(let d=1;d<=days;d++){const key=uid+'-'+d,value=pageState.data.cells[key]||'';if(value==='W')shifts++;const unavailable=BbAvailability.isUnavailable(person.availability,year,month,d);const cellEditable=editable&&(value!=='z'||r.canManageAbsence);const collision=value==='W'&&(dupes.get(d)?.length||0)>1;const info=duplicateTitle(d);html+=`<td data-cell-key="${key}" class="${[0,6].includes(new Date(year,month-1,d).getDay())?'weekend ':''}${unavailable?'unavailable ':''}${unavailable&&value==='W'?'working ':''}${collision?'duplicate':''}" title="${esc([unavailable?'Pravidelné volno BB — tento den nemůže pracovat.':'',collision?'Duplicitní směna\n'+info:''].filter(Boolean).join('\n'))}">${cellEditable?`<input data-cell="${key}" value="${esc(value)}" maxlength="1" aria-label="${esc(person.name)}, ${d}.${month}." autocomplete="off">`:esc(value)}</td>`;}
html+=`<td class="total">${shifts}</td><td class="total">${shifts*12}</td>`;if(pageState.view==='requests'){const note=pageState.data.notes?.[uid]||'';html+='<td>'+(editable?`<textarea class="pr" data-note="${uid}" maxlength="10000" aria-label="PR ${esc(person.name)}">${esc(note)}</textarea>`:esc(note))+'</td>';}html+='</tr>';}
$('table').innerHTML=html+'</tbody></table>';msg(pageState.view==='requests'&&!pageState.editing?(r.status==='open'?'Požadavky jsou otevřené pro zápis.':'Editace požadavků je ukončená.'):'');
}
async function load(){const selected=period();const epoch=++pageState.epoch;pageState.loading=true;$('table').hidden=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('table').setAttribute('aria-busy','true');try{const r=await api('/api/bb/month?'+new URLSearchParams(selected));if(epoch!==pageState.epoch)return;pageState.result=r;if(!r.permissions[pageState.view+'_view'])pageState.view=r.permissions.requests_view?'requests':'schedule';pageState.editing=false;pageState.dirty=false;const source=pageState.view==='requests'?r.requirements:r.published;pageState.data=source?structuredClone(source):null;
if(pageState.view==='schedule'&&pageState.data){pageState.data.cells=pageState.data.cells||{};pageState.data.staffIds=pageState.data.staffIds||[];for(const key of Object.keys(pageState.data.cells))if(pageState.data.cells[key]==='W')delete pageState.data.cells[key];for(const s of r.shifts||[]){if(!pageState.data.staffIds.includes(s.userId))pageState.data.staffIds.push(s.userId);pageState.data.cells[s.userId+'-'+Number(s.date.slice(8))]='W';}}
render();}catch(e){if(epoch===pageState.epoch){pageState.result=null;$('table').innerHTML='';msg(e.message,true);}}finally{if(epoch===pageState.epoch){pageState.loading=false;$('table').hidden=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(pageState.result)render();$('table').removeAttribute('aria-busy');}}}
function leaving(){return !pageState.dirty||confirm('Máte neuložené změny BB. Zahodit je?');}
$('table').addEventListener('input',e=>{const key=e.target.dataset.cell,uid=e.target.dataset.note;if(key){const raw=e.target.value.trim();const value=raw.toLowerCase()==='w'?'W':raw.toLowerCase();if(value&&!['W','x',...(pageState.result.canManageAbsence?['z']:[])].includes(value)){e.target.value=pageState.data.cells[key]||'';return;}if(value)pageState.data.cells[key]=value;else delete pageState.data.cells[key];e.target.value=value;pageState.dirty=true;refreshEditedCells();}if(uid){pageState.data.notes=pageState.data.notes||{};pageState.data.notes[uid]=e.target.value;pageState.dirty=true;}});
$('table').addEventListener('change',e=>{if(e.target.dataset.cell)refreshEditedCells();});
$('edit').onclick=()=>{pageState.editing=true;render();};$('cancel').onclick=()=>{if(leaving())load();};
for(const id of ['month','year'])$(id).onchange=()=>{if(leaving())load();else{$('month').value=pageState.result.month;$('year').value=pageState.result.year;}};
$('add').onclick=()=>{const uid=Number($('add-person').value);if(uid&&!pageState.data.staffIds.includes(uid)){pageState.data.staffIds.push(uid);const person=pageState.result.available.find(s=>s.userId===uid);if(person&&!pageState.result.staff.some(s=>s.userId===uid))pageState.result.staff.push(person);pageState.dirty=true;render();}};
async function perform(url,body){
 if(pageState.loading||pageState.saving)return;
 const selected=pageState.result?{month:pageState.result.month,year:pageState.result.year}:period();pageState.saving=true;
 document.querySelectorAll('button').forEach(b=>b.disabled=true);$('month').disabled=true;$('year').disabled=true;
 let error=null;
 try{for(;;){try{await api(url,{...selected,...body});break;}catch(e){if(e.duplicates?.length&&!body.confirmDuplicates&&confirm(e.message)){body={...body,confirmDuplicates:true};continue;}throw e;}}
   try{parent.postMessage({type:'bb-changed'},location.origin);}catch{}await load();
 }catch(e){error=e;}finally{pageState.saving=false;$('month').disabled=false;$('year').disabled=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);render();if(error)msg(error.message,true);}
}
$('create').onclick=()=>perform('/api/bb/create',{});$('toggle').onclick=()=>{if(leaving())perform('/api/bb/status',{status:pageState.result.status==='open'?'closed':'open'});};
$('save').onclick=()=>{const r=pageState.result;perform(pageState.view==='requests'?'/api/bb/requests':'/api/bb/schedule',{data:pageState.data,revision:pageState.view==='requests'?r.revision:r.publishedRevision,rowVersion:r.requirements?.rowVersions?.[r.userId]||0});};
$('publish').onclick=()=>{if(confirm('Publikovat požadavky jako Rozpis BB? PR zůstane pouze v požadavcích.'))perform('/api/bb/publish',{revision:pageState.result.revision,publishedRevision:pageState.result.publishedRevision});};
window.addEventListener('beforeunload',e=>{if(pageState.dirty){e.preventDefault();e.returnValue='';}});window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='bb-visible'&&!pageState.editing)load();});setInterval(()=>{if(!document.hidden&&!pageState.editing)load();},30000);load();
</script></body></html>
