<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikotin - AVE</title>
<link rel="icon" href="/static/logo.png">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px 'Segoe UI',system-ui,sans-serif}.page{max-width:960px;margin:auto;padding:18px 18px max(28px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:16px}header img{height:32px;width:auto}h1{font-size:24px;margin:0 auto 0 0}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0 0 10px}button,input,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--btn-top-border);border-radius:6px}button{cursor:pointer;min-height:44px;padding:9px 14px;font-weight:600}button:disabled{opacity:.5;cursor:default}button.primary,nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}nav{display:flex;gap:6px}section{padding-top:22px}[hidden]{display:none!important}.day-nav,.section-head,.tools,.progress-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.day-nav h2{flex:1;text-align:center}.icon{width:44px;padding:0;font-size:24px}.muted{color:var(--muted);font-size:14px}.notice{margin:16px 0;padding:12px;border-left:3px solid var(--accent);background:var(--surface)}.notice.error{border-color:#bc3333;color:#bc3333}.progress-row{margin:20px 0 8px;justify-content:space-between}progress{width:100%;height:10px;accent-color:var(--accent)}.tasks{margin-top:12px}fieldset.task{margin:0;padding:18px 0;border:0;border-bottom:1px solid var(--border);min-width:0}.task legend{float:left;width:100%;margin-bottom:12px;font-weight:600;line-height:1.5}.task-options{clear:both;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.task-options label{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--btn-top-border);border-radius:6px;padding:8px 4px;cursor:pointer;font-size:14px}.task-options input{position:absolute;opacity:0;width:1px;height:1px}.task-options label:has(input:focus-visible){outline:2px solid var(--accent)}.task-options label:has(input:checked){background:var(--bg-controls);font-weight:700}.task-options label.done:has(input:checked){background:#dcf4e5;color:#155a32;border-color:#228b4d}.task-options label.missed:has(input:checked){background:#ffe5e5;color:#8d2222;border-color:#bd3737}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.field{display:grid;gap:8px;align-content:start;min-width:0}.field input,.field textarea{width:100%;min-height:48px;padding:10px}.field small{line-height:1.5}.wide{grid-column:1/-1}textarea{min-height:100px;resize:vertical}.save-row{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin:18px 0}.section-head{justify-content:space-between}.history-row{border-bottom:1px solid var(--border);padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:8px 16px}.history-metrics{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}.history-note{grid-column:1/-1;white-space:pre-wrap;overflow-wrap:anywhere}.charts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}.chart{min-width:0}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:58px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}.track{height:12px;background:var(--bg-controls);border-radius:3px;overflow:hidden}.bar{height:100%;background:#258a87}.chart.velo .bar{background:#b96523}.bar-row output{text-align:right}.plan-row{border-bottom:1px solid var(--border);padding:18px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.plan-row p{margin:6px 0 0}.plan-form{border-top:1px solid var(--border);margin-top:20px;padding-top:20px}.breaks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.copy-dialog{width:min(680px,calc(100% - 24px));background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px}.copy-dialog::backdrop{background:#0008}.copy-dialog textarea{width:100%;min-height:280px;padding:10px}#save-status{font-size:14px}.date-caption{margin-top:8px;text-align:center}@media(max-width:600px){.page{padding:14px 12px 28px}header{gap:10px}header img{height:25px}h1{font-size:22px}nav{width:100%}nav button{flex:1;padding:8px}.fields,.charts{grid-template-columns:1fr}.wide{grid-column:auto}.breaks{grid-template-columns:1fr 1fr}.day-nav h2{font-size:18px}.tools{width:100%}.tools button{flex:1}.history-row{gap:10px}.plan-row{align-items:flex-start}}
header img{filter:brightness(0) saturate(100%) invert(18%) sepia(26%) saturate(1338%) hue-rotate(166deg) brightness(91%) contrast(91%)}[data-theme="dark"] header img{filter:brightness(0) invert(1)}
</style>
</head>
<body>
<main class="page">
<header><img src="/static/logo.png" alt="AVE"><h1>Nikotin</h1><nav aria-label="Nikotin"><button data-tab="day" aria-pressed="true">Den</button><button data-tab="history" aria-pressed="false">Historie</button><button data-tab="plans" aria-pressed="false">Plány</button></nav></header>
<div id="message" class="notice" role="status" hidden></div>
<section id="view-day"><div class="day-nav"><button id="previous" class="icon" aria-label="Předchozí den" title="Předchozí den">&#8249;</button><h2 id="day-title"></h2><button id="next" class="icon" aria-label="Další den" title="Další den">&#8250;</button></div><div class="date-caption"><button id="current" hidden>Aktuální záznam</button></div><div id="day-notice" class="notice" hidden></div><div id="day-content"><div class="progress-row"><strong id="progress-label"></strong><span id="entry-state" class="muted"></span></div><progress id="progress" max="3" value="0" aria-label="Splněné úkoly"></progress><div id="tasks" class="tasks"></div><p class="muted">Pauzy bez elektronické cigarety i Vela, během běžných aktivit. Doba jídla se do pauz nezapočítává.</p><div class="fields"><label class="field"><strong id="puffs-label">Počet puffů</strong><input id="puffs" type="number" min="0" max="1000000" step="1" inputmode="numeric"><small id="puffs-hint" class="muted"></small></label><label class="field"><strong>Počet sáčků Velo</strong><input id="velo" type="number" min="0" max="1000000" step="1" inputmode="numeric"><small class="muted">Doplňte večer za tento den. Nulovou spotřebu zapište jako 0.</small></label><label class="field wide"><strong>Poznámka</strong><textarea id="note" maxlength="10000" placeholder="Pocity, obtížnost, průběh dne"></textarea></label></div><div class="save-row"><span id="save-status" role="status"></span><button id="save" class="primary">Uložit</button></div></div></section>
<section id="view-history" hidden><div class="section-head"><h2>Historie</h2><div class="tools"><button id="csv">Export CSV</button><button id="copy">Kopírovat přehled</button></div></div><div id="charts" class="charts"></div><div id="history-list"></div></section>
<section id="view-plans" hidden><div class="section-head"><h2>Plány</h2><button id="new-plan">Nový plán</button></div><div id="plan-list"></div><form id="plan-form" class="plan-form" hidden><h3 id="plan-title">Nový plán</h3><div class="fields"><label class="field"><strong>Od</strong><input id="plan-start" type="date" required></label><label class="field"><strong>Do</strong><input id="plan-end" type="date" required></label><label class="field"><strong>Ranní pauza (minuty)</strong><input id="plan-morning" type="number" min="1" max="600" required inputmode="numeric"></label><label class="field"><strong>Počet dalších pauz</strong><input id="plan-count" type="number" min="0" max="12" required inputmode="numeric"></label><div id="plan-breaks" class="breaks wide"></div></div><div class="save-row"><button type="button" id="cancel-plan">Zrušit</button><button class="primary">Uložit plán</button></div></form></section>
</main>
<dialog id="copy-dialog" class="copy-dialog"><h2>Textový přehled</h2><textarea id="copy-text" readonly aria-label="Přehled ke kopírování"></textarea><div class="save-row"><button id="close-copy">Zavřít</button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const state={today:'',plans:[],days:[],active_day:null,selected:null,manual:false,tab:'day',dirty:false,saving:false,revision:0,planId:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nextDate(day){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);}
function dateLabel(day,weekday=false){return new Date(day+'T12:00:00Z').toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',...(weekday?{weekday:'long'}:{})});}
function planFor(day){return state.plans.find(p=>p.start_date<=day&&p.end_date>=day);}
function dayFor(day){const saved=state.days.find(d=>d.day===day);if(saved)return structuredClone(saved);const p=planFor(day);if(!p)return null;const tasks=[{kind:'morning',minutes:p.morning_minutes},...p.break_minutes.map(minutes=>({kind:'break',minutes}))];return {day,tasks,statuses:tasks.map(()=>null),puffs:null,velo:null,note:''};}
function isComplete(day){return day&&day.puffs!==null&&day.velo!==null&&day.statuses.every(s=>s==='done'||s==='missed');}
function plannedDays(){const days=[];for(const p of state.plans)for(let d=p.start_date;d<=p.end_date&&d<=state.today;d=nextDate(d))days.push(d);return days;}
function firstIncomplete(){return plannedDays().find(day=>!isComplete(dayFor(day)))||null;}
function preferredDay(){return firstIncomplete()||plannedDays().at(-1)||state.plans[0]?.start_date||null;}
function message(text,error=false){$('message').hidden=!text;$('message').textContent=text;$('message').classList.toggle('error',error);}
async function api(url,options={}){const response=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.msg||'Akce se nepodařila.');return data;}
async function load(){try{const data=await api('/api/nikotin');Object.assign(state,{today:data.today,plans:data.plans,days:data.days,active_day:data.active_day});if(!state.manual||!planFor(state.selected))state.selected=preferredDay();render();message('');}catch(e){message(e.message,true);}}
function render(){renderDay();renderHistory();renderPlans();}
function renderDay(){const day=dayFor(state.selected);$('day-content').hidden=!day;if(!day){$('day-title').textContent='Zatím není plán';return;}const future=day.day>state.today;const dates=plannedDays(),index=dates.indexOf(day.day);$('day-title').textContent=dateLabel(day.day,true);$('previous').disabled=index<=0;$('next').disabled=index<0||index>=dates.length-1;$('current').hidden=!state.manual;$('day-notice').hidden=false;$('day-notice').textContent=future?'Plán začíná '+dateLabel(day.day)+'.':day.day<state.today&&!isComplete(day)?'Dokončete tento den. Puffy doplňte za datum uvedené nahoře.':!firstIncomplete()?'Všechny dosavadní dny jsou vyplněné.':day.day===state.today&&isComplete(day)?'Dnešní záznam je hotový. Další den se otevře, až nastane.':'';$('day-notice').hidden=!$('day-notice').textContent;const done=day.statuses.filter(s=>s==='done').length;$('progress-label').textContent=done+' / '+day.tasks.length+' splněno';$('progress').max=day.tasks.length;$('progress').value=done;$('entry-state').textContent=isComplete(day)?'Vyplněno':'Rozpracováno';let breakIndex=0;$('tasks').innerHTML=day.tasks.map((task,i)=>{const title=task.kind==='morning'?'Ráno '+task.minutes+' minut od probuzení bez nikotinu':(++breakIndex)+'. pauza: '+task.minutes+' minut bez nikotinu';return `<fieldset class="task" ${future?'disabled':''}><legend>${esc(title)}</legend><div class="task-options">${[[null,'Nevyplněno',''],['done','Splněno','done'],['missed','Nesplněno','missed']].map(([value,label,cls])=>`<label class="${cls}"><input type="radio" name="task-${i}" data-task="${i}" value="${value||''}" ${day.statuses[i]===value?'checked':''}>${label}</label>`).join('')}</div></fieldset>`;}).join('');$('puffs-label').textContent='Puffy za '+dateLabel(day.day);$('puffs-hint').textContent='Doplňte ráno '+dateLabel(nextDate(day.day))+', před prvním potáhnutím a vynulováním počítadla.';for(const key of ['puffs','velo','note']){$(key).value=day[key]??'';$(key).disabled=future;}$('save').disabled=future;$('save-status').textContent='';}
function readDraft(){const day=dayFor(state.selected);day.statuses=day.tasks.map((_,i)=>document.querySelector(`input[name="task-${i}"]:checked`)?.value||null);for(const key of ['puffs','velo']){const value=$(key).value;if(!$(key).checkValidity())throw new Error('Spotřeba musí být celé nezáporné číslo.');day[key]=value===''?null:Number(value);}day.note=$('note').value;return day;}
async function save(){if(state.saving||!state.dirty)return !state.dirty;let draft;try{draft=readDraft();}catch(e){message(e.message,true);return false;}const revision=state.revision;state.saving=true;$('save-status').textContent='Ukládám…';try{const result=await api('/api/nikotin/days/'+draft.day,{method:'PUT',body:JSON.stringify(draft)});const index=state.days.findIndex(d=>d.day===draft.day);if(index<0)state.days.push(result.day);else state.days[index]=result.day;state.dirty=state.revision!==revision;$('save-status').textContent=state.dirty?'Neuložené změny':'Uloženo';message('');if(!state.dirty){$('entry-state').textContent=isComplete(result.day)?'Vyplněno':'Rozpracováno';renderHistory();if(!state.manual&&isComplete(result.day)){const next=firstIncomplete();if(next&&next!==state.selected){state.selected=next;renderDay();}else if(!next){$('day-notice').textContent='Všechny dosavadní dny jsou vyplněné.';$('day-notice').hidden=false;}}}return !state.dirty;}catch(e){message(e.message,true);$('save-status').textContent='Neuloženo';return false;}finally{state.saving=false;if(state.dirty&&revision!==state.revision)save();}}
function changed(){state.dirty=true;state.revision++;$('save-status').textContent='Neuložené změny';const statuses=[...document.querySelectorAll('#tasks input:checked')];const done=statuses.filter(i=>i.value==='done').length;$('progress').value=done;$('progress-label').textContent=done+' / '+statuses.length+' splněno';}
async function navigate(day,manual=true){if(state.saving)return;if(state.dirty&&!await save())return;state.manual=manual;state.selected=day;renderDay();}
function renderHistory(){const dates=plannedDays().reverse();$('history-list').innerHTML=dates.map(date=>{const d=dayFor(date);return `<article class="history-row"><div><strong>${esc(dateLabel(date))}</strong><div class="history-metrics"><span>${d.statuses.filter(s=>s==='done').length} / ${d.tasks.length} splněno</span><span>Puffy: ${d.puffs??'—'}</span><span>Velo: ${d.velo??'—'}</span></div></div><button data-open-day="${date}">Upravit</button>${d.note?`<div class="history-note">${esc(d.note)}</div>`:''}</article>`;}).join('')||'<p class="muted">Zatím žádné záznamy.</p>';const ordered=[...dates].reverse().slice(-30).map(dayFor);$('charts').innerHTML=[['puffs','Puffy',''],['velo','Velo','velo']].map(([key,label,cls])=>{const max=Math.max(1,...ordered.map(d=>d[key]??0));return `<div class="chart ${cls}"><h3>${label}</h3><div class="bars">${ordered.map(d=>`<div class="bar-row"><span>${esc(dateLabel(d.day).replace(/\s*\d{4}$/,''))}</span><div class="track"><div class="bar" style="width:${d[key]===null?0:d[key]/max*100}%"></div></div><output aria-label="${label} ${dateLabel(d.day)}">${d[key]??'—'}</output></div>`).join('')}</div></div>`;}).join('');}
function renderPlans(){$('plan-list').innerHTML=state.plans.map(p=>`<div class="plan-row"><div><strong>${esc(dateLabel(p.start_date))} – ${esc(dateLabel(p.end_date))}</strong><p class="muted">Ráno ${p.morning_minutes} min · ${p.break_minutes.length?p.break_minutes.map(v=>v+' min').join(' + '):'Bez dalších pauz'}</p></div>${p.start_date>state.today?`<button data-edit-plan="${p.id}">Upravit</button>`:''}</div>`).join('');}
function renderBreaks(values=[]){const count=Number($('plan-count').value);if(!Number.isInteger(count)||count<0||count>12)return;$('plan-breaks').innerHTML=Array.from({length:count},(_,i)=>`<label class="field"><strong>${i+1}. pauza (minuty)</strong><input type="number" min="1" max="600" required inputmode="numeric" value="${values[i]??30}"></label>`).join('');}
function openPlan(id=null){const plan=state.plans.find(p=>p.id===id);state.planId=id;$('plan-title').textContent=plan?'Upravit plán':'Nový plán';$('plan-start').value=plan?.start_date||nextDate(state.plans.at(-1)?.end_date||state.today);$('plan-end').value=plan?.end_date||$('plan-start').value;$('plan-start').min=nextDate(state.today);$('plan-end').min=nextDate(state.today);$('plan-morning').value=plan?.morning_minutes||15;$('plan-count').value=plan?.break_minutes.length??2;renderBreaks(plan?.break_minutes||[]);$('plan-form').hidden=false;}
async function switchTab(tab){if(state.saving)return;if(state.dirty&&!await save())return;state.tab=tab;document.querySelectorAll('[data-tab]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.tab===tab)));for(const name of ['day','history','plans'])$('view-'+name).hidden=name!==tab;}
function summary(){return 'Nikotin – osobní deník\nPauzy mimo jídlo; puffy doplněné následující ráno patří předchozímu dni.\n\n'+plannedDays().map(date=>{const d=dayFor(date);return dateLabel(date)+'\n'+d.tasks.map((t,i)=>(t.kind==='morning'?'Ranní pauza':'Pauza')+' '+t.minutes+' min: '+({done:'splněno',missed:'nesplněno'}[d.statuses[i]]||'nevyplněno')).join('\n')+'\nPuffy: '+(d.puffs??'nevyplněno')+'; Velo: '+(d.velo??'nevyplněno')+(d.note?'\nPoznámka: '+d.note:'');}).join('\n\n');}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>switchTab(btn.dataset.tab));
$('tasks').onchange=()=>{changed();save();};for(const key of ['puffs','velo','note']){$(key).oninput=changed;$(key).onchange=()=>save();}$('save').onclick=save;
$('previous').onclick=()=>{const dates=plannedDays();navigate(dates[dates.indexOf(state.selected)-1]);};$('next').onclick=()=>{const dates=plannedDays();navigate(dates[dates.indexOf(state.selected)+1]);};$('current').onclick=()=>navigate(preferredDay(),false);
$('history-list').onclick=async e=>{const button=e.target.closest('[data-open-day]');if(button){await navigate(button.dataset.openDay);switchTab('day');}};
$('plan-list').onclick=e=>{const button=e.target.closest('[data-edit-plan]');if(button)openPlan(Number(button.dataset.editPlan));};$('new-plan').onclick=()=>openPlan();$('cancel-plan').onclick=()=>{$('plan-form').hidden=true;};$('plan-count').oninput=()=>renderBreaks([...$('plan-breaks').querySelectorAll('input')].map(i=>i.value));
$('plan-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{await api('/api/nikotin/plans'+(state.planId?'/'+state.planId:''),{method:state.planId?'PUT':'POST',body:JSON.stringify({start_date:$('plan-start').value,end_date:$('plan-end').value,morning_minutes:Number($('plan-morning').value),break_minutes:[...$('plan-breaks').querySelectorAll('input')].map(i=>Number(i.value))})});$('plan-form').hidden=true;await load();}catch(err){message(err.message,true);}finally{button.disabled=false;}};
$('csv').onclick=()=>{const a=document.createElement('a');a.href='/api/nikotin/export.csv';a.download='nikotin.csv';a.click();};$('copy').onclick=async()=>{const text=summary();try{await navigator.clipboard.writeText(text);message('Přehled zkopírován.');}catch{$('copy-text').value=text;$('copy-dialog').showModal();$('copy-text').focus();$('copy-text').select();}};$('close-copy').onclick=()=>$('copy-dialog').close();
window.addEventListener('beforeunload',e=>{if(state.dirty||state.saving){e.preventDefault();e.returnValue='';}});
function refresh(){if(!state.dirty&&!state.saving&&!document.hidden&&$('plan-form').hidden)load();}
document.addEventListener('visibilitychange',refresh);window.addEventListener('focus',refresh);setInterval(refresh,60000);load();
</script>
</body>
</html>
